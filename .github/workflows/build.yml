name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 下载 Xposed API 82
        run: |
          set -e
          mkdir -p app/libs
          for url in \
            "https://maven.aliyun.com/repository/jcenter/de/robv/android/xposed/api/82/api-82.jar" \
            "https://repo1.maven.org/maven2/de/robv/android/xposed/api/82/api-82.jar"; do
            if curl -fsSL --retry 2 -o app/libs/xposed-api-82.jar "$url"; then
              echo "downloaded: $url"
              exit 0
            fi
          done
          echo "所有镜像都拿不到 api-82.jar" >&2
          exit 1

      - name: 装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 生成签名
        run: |
          keytool -genkeypair -v -keystore release.jks -alias sb \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass statusbar -keypass statusbar \
            -dname "CN=StatusBarBeautify, OU=dev, O=dev, L=CN, C=CN"

      - name: 编译 release
        env:
          SB_STORE_FILE: release.jks
          SB_STORE_PASSWORD: statusbar
          SB_KEY_ALIAS: sb
          SB_KEY_PASSWORD: statusbar
        run: gradle assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: statusbar-beautify
          path: app/build/outputs/apk/release/*.apk
